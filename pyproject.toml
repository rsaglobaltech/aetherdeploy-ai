[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherdeploy"
version = "0.1.0"
description = "Agentic multicloud deployment system powered by AI"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "gitpython>=3.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "docker>=7.0",
]

[project.optional-dependencies]
# Cloud provider SDKs — install the ones you need
aws = ["boto3>=1.34"]
gcp = ["google-auth>=2.0", "google-auth-httplib2>=0.2"]
azure = ["azure-identity>=1.16"]

# Observability — install when AETHER_OTEL_ENABLED=true
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]

# Install everything (convenient for development)
all = ["aetherdeploy[aws,gcp,azure,otel]"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "moto[all]>=5.0",
    "responses>=0.25",
]

[project.scripts]
aetherdeploy = "aetherdeploy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aetherdeploy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
